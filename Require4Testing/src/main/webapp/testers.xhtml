<!DOCTYPE html>
<ui:composition template="/WEB-INF/templates/layout.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui">
                
    <!-- Inhalt für den Platzhalter "content" aus layout.xhtml -->            
    <ui:define name="content">
        <h2>Tester:innen</h2>

        <h:form>
        	<!-- Erfassungsformular: Neue/n Tester:in anlegen -->
            <div class="panel">
                <div class="form-grid">
                    <div class="form-field">
                        <h:outputLabel for="firstName" value="Vorname" />
                        <h:inputText id="firstName" value="#{testerPageBean.tester.firstName}" required="true" />
                    </div>
                    <div class="form-field">
                        <h:outputLabel for="lastName" value="Nachname" />
                        <h:inputText id="lastName" value="#{testerPageBean.tester.lastName}" required="true" />
                    </div>
                    <div class="form-field">
                        <h:outputLabel for="email" value="E-Mail" />
                        <h:inputText id="email" value="#{testerPageBean.tester.email}" required="true" />
                    </div>
                </div>
                <p:commandButton value="Tester:in speichern" action="#{testerPageBean.save}" styleClass="btn" ajax="false" />
            </div>

			<!-- Übersichtstabelle: Alle gespeicherten Tester:innen -->
            <div class="panel">
                <h:dataTable value="#{testerPageBean.testers}" var="tester" styleClass="data-table">
                    <h:column>
                        <f:facet xmlns:f="http://xmlns.jcp.org/jsf/core" name="header">ID</f:facet>
                        #{tester.id}
                    </h:column>
                    <h:column>
                        <f:facet xmlns:f="http://xmlns.jcp.org/jsf/core" name="header">Name</f:facet>
                        #{tester.fullName}
                    </h:column>
                    <h:column>
                        <f:facet xmlns:f="http://xmlns.jcp.org/jsf/core" name="header">E-Mail</f:facet>
                        #{tester.email}
                    </h:column>
                </h:dataTable>
            </div>
        </h:form>
    </ui:define>
</ui:composition>
