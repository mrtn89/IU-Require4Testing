<!DOCTYPE html>
<ui:composition template="/WEB-INF/templates/layout.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core">
    
    <!-- Inhalt für den Platzhalter "content" aus layout.xhtml -->
    <ui:define name="content">
        <h2>Anforderungen</h2>

        <h:form>
      		<!-- Erfassungsformular: Neues Requirement anlegen -->
            <div class="panel">
                <div class="form-grid">
                    <div class="form-field">
                        <h:outputLabel for="title" value="Titel" />
                        <h:inputText id="title" value="#{requirementPageBean.requirement.title}" required="true" />
                    </div>
                    <div class="form-field">
                        <h:outputLabel for="priority" value="Priorität" />
                        <h:selectOneMenu id="priority" value="#{requirementPageBean.requirement.priority}">
                            <f:selectItems value="#{requirementPageBean.priorities}" var="priority" itemValue="#{priority}" itemLabel="#{priority.label}" />
                        </h:selectOneMenu>
                    </div>
                    <div class="form-field">
                        <h:outputLabel for="status" value="Status" />
                        <h:selectOneMenu id="status" value="#{requirementPageBean.requirement.status}">
                            <f:selectItems value="#{requirementPageBean.statuses}" var="status" itemValue="#{status}" itemLabel="#{status.label}" />
                        </h:selectOneMenu>
                    </div>
                    <div class="form-field" style="grid-column: 1 / -1;">
                        <h:outputLabel for="description" value="Beschreibung" />
                        <h:inputTextarea id="description" value="#{requirementPageBean.requirement.description}" required="true" />
                    </div>
                </div>
                <p:commandButton value="Anforderung speichern" action="#{requirementPageBean.save}" styleClass="btn" ajax="false" />
            </div>

			<!-- Übersichtstabelle: Alle gespeicherten Requirements -->
            <div class="panel">
                <h:dataTable value="#{requirementPageBean.requirements}" var="requirement" styleClass="data-table">
                    <h:column>
                        <f:facet name="header">ID</f:facet>
                        #{requirement.id}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Titel</f:facet>
                        #{requirement.title}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Beschreibung</f:facet>
                        #{requirement.description}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Priorität</f:facet>
                        <span class="tag">#{requirement.priority.label}</span>
                    </h:column>
                    <h:column>
                        <f:facet name="header">Status</f:facet>
                        #{requirement.status.label}
                    </h:column>
                </h:dataTable>
            </div>
        </h:form>
    </ui:define>
</ui:composition>
