<!DOCTYPE html>
<ui:composition template="/WEB-INF/templates/layout.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core">
                
    <!-- Inhalt für den Platzhalter "content" aus layout.xhtml -->
    <ui:define name="content">
        <h2>Testfälle</h2>

        <h:form>
        	<!-- Erfassungsformular: Neuen Testfall anlegen -->
            <div class="panel">
                <div class="form-grid">
                    <div class="form-field">
                        <h:outputLabel for="requirement" value="Anforderung" />
                        <h:selectOneMenu id="requirement" value="#{testCasePageBean.requirementId}">
                            <f:selectItem itemLabel="Bitte wählen" itemValue="#{null}" />
                            <f:selectItems value="#{testCasePageBean.requirements}" var="requirement" itemValue="#{requirement.id}" itemLabel="#{requirement.title}" />
                        </h:selectOneMenu>
                    </div>
                    <div class="form-field">
                        <h:outputLabel for="title" value="Titel" />
                        <h:inputText id="title" value="#{testCasePageBean.testCase.title}" required="true" />
                    </div>
                    <div class="form-field">
                        <h:outputLabel for="status" value="Status" />
                        <h:selectOneMenu id="status" value="#{testCasePageBean.testCase.status}">
                            <f:selectItems value="#{testCasePageBean.statuses}" var="status" itemValue="#{status}" itemLabel="#{status.label}" />
                        </h:selectOneMenu>
                    </div>
                    <div class="form-field" style="grid-column: 1 / -1;">
                        <h:outputLabel for="precondition" value="Vorbedingung" />
                        <h:inputTextarea id="precondition" value="#{testCasePageBean.testCase.precondition}" />
                    </div>
                    <div class="form-field" style="grid-column: 1 / -1;">
                        <h:outputLabel for="steps" value="Schritte" />
                        <h:inputTextarea id="steps" value="#{testCasePageBean.testCase.steps}" required="true" />
                    </div>
                    <div class="form-field" style="grid-column: 1 / -1;">
                        <h:outputLabel for="expected" value="Erwartetes Ergebnis" />
                        <h:inputTextarea id="expected" value="#{testCasePageBean.testCase.expectedResult}" required="true" />
                    </div>
                </div>
                <p:commandButton value="Testfall speichern" action="#{testCasePageBean.save}" styleClass="btn" ajax="false" />
            </div>

			<!-- Übersichtstabelle: Alle gespeicherten Testfälle -->
            <div class="panel">
                <h:dataTable value="#{testCasePageBean.testCases}" var="testCase" styleClass="data-table">
                    <h:column>
                        <f:facet name="header">ID</f:facet>
                        #{testCase.id}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Anforderung</f:facet>
                        #{testCase.requirement.title}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Titel</f:facet>
                        #{testCase.title}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Schritte</f:facet>
                        #{testCase.steps}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Erwartetes Ergebnis</f:facet>
                        #{testCase.expectedResult}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Status</f:facet>
                        #{testCase.status.label}
                    </h:column>
                </h:dataTable>
            </div>
        </h:form>
    </ui:define>
</ui:composition>
